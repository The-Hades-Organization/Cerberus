name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # sha do Hades-Skill contra o qual o job parity roda; trocar é mudança explícita, e o diff da matriz mostra o que mudou no TS
  HADES_SKILL_SHA: f831727b336e6fcd736f032ac23e8509c98d29eb
  # tag do Hades-Core de onde sai o runner da matriz
  HADES_CORE_TAG: v0.2.5

permissions:
  contents: read

jobs:
  parity:
    name: Paridade TS x Rust
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: The-Hades-Organization/Hades-Skill
          ref: ${{ env.HADES_SKILL_SHA }}
          path: hades-skill
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # a do bun.lock da skill
      - name: Dependências da skill
        working-directory: hades-skill
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Runner da matriz (Hades-Core)
        run: cargo install --locked --git https://github.com/The-Hades-Organization/Hades-Core --tag "$HADES_CORE_TAG" --root "$RUNNER_TEMP/hades-parity" hades-parity
      - name: Compilar o Cerberus
        run: cargo build --locked -p cerberus-cli
      - name: Bubblewrap para o ensaio do Limiar
        run: |
          # o AppArmor do Ubuntu 24.04 barra user namespace sem privilégio; no 22.04 a chave não existe
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update -q
          sudo apt-get install -y bubblewrap
          bwrap --unshare-pid --ro-bind / / -- true
      - name: Montar a skill
        run: |
          parity/montar-skill.sh hades-skill "$RUNNER_TEMP/skill"
          parity/montar-skill.sh hades-skill "$RUNNER_TEMP/skill-tipo" tipo
          parity/montar-skill.sh hades-skill "$RUNNER_TEMP/skill-json" json
      - name: Matriz de paridade
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases.toml
          --ts "$RUNNER_TEMP/skill"
          --rust target/debug/cerberus
      - name: Matriz com registro de tipo inválido
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases-registro-tipo.toml
          --ts "$RUNNER_TEMP/skill-tipo"
          --rust target/debug/cerberus
      - name: Matriz com registro de JSON quebrado
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases-registro-json.toml
          --ts "$RUNNER_TEMP/skill-json"
          --rust target/debug/cerberus
      - name: Matriz da Porta
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases-porta.toml
          --ts "$RUNNER_TEMP/skill"
          --rust target/debug/cerberus
      - name: Matriz com o erro do parser normalizado
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases-parser.toml
          --ts "$RUNNER_TEMP/skill"
          --rust parity/rust-parser.sh
      - name: Estados de plugin do Limiar
        run: bun parity/limiar-estado.ts "$RUNNER_TEMP/skill" parity/gerado/limiar
      - name: Matriz do Limiar e do Ensaio
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases-limiar.toml
          --ts "$RUNNER_TEMP/skill"
          --rust target/debug/cerberus
      - name: Concorrência TS x Rust
        run: parity/concorrencia.sh "$RUNNER_TEMP/skill" target/debug/cerberus

  core:
    name: Core (sem gpui)
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude cerberus-app --all-targets --locked -- -D warnings
      - name: Bubblewrap para o ensaio do Limiar
        run: |
          # o AppArmor do Ubuntu 24.04 barra user namespace sem privilégio; no 22.04 a chave não existe
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update -q
          sudo apt-get install -y bubblewrap
          bwrap --unshare-pid --ro-bind / / -- true
      - run: cargo test --workspace --exclude cerberus-app --locked
        env:
          # os casos de bwrap não pulam no CI
          CERBERUS_BWRAP_OBRIGATORIO: '1'
      - name: Bench de partida (falha acima de 50 ms)
        run: |
          cargo build --release --locked -p cerberus-cli
          scripts/bench-partida.sh target/release/cerberus 50 15

  app:
    name: App (gpui)
    if: github.event_name != 'schedule'
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Dependências do Linux
        run: ./scripts/linux-deps.sh
      - run: cargo clippy -p cerberus-app --all-targets --locked -- -D warnings

  app-build:
    name: App build (gpui)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependências do Linux
        run: ./scripts/linux-deps.sh
      - run: cargo build -p cerberus-app --locked
