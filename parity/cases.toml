argv = ["estado", "--json"]
ts_cmd = ["{skill}/src/cli.ts", "cerberus"]
fixture = "hist"
setup = "setup-estado.sh"
env = { HADES_CERBERUS_TIMEOUT_S = "3", HADES_CERBERUS_PORTA = "barra" }
compare = ["stdout", "stderr", "exit"]

[[case]]
id = "arquivo.linha-cortada"
argv = ["historico", "--json", "--limite", "3"]
ts_cmd = ["{skill}/src/cli.ts", "cerberus"]
fixture = "rotacao"
setup = "setup-linha-cortada.sh"
env = { HADES_CERBERUS_TIMEOUT_S = "3" }
compare = ["stdout", "stderr", "exit"]

