# Matriz de paridade do Cerberus: `hades cerberus ...` (TS, Hades-Skill) contra o binário `cerberus`.
# O argv é o do binário; o lado TS ganha o subcomando `cerberus` por `ts_cmd`. A skill (--ts e HADES_SKILL_DIR) é a
# montada por parity/montar-skill.sh: registro e catálogo de parity/fixtures/skill-min (guardas de teste t-*).
# Origem: o golden legado do TS (loop/test/golden/legado/cerberus-ts.json, loop/test/ts/cerberus-ts.test.ts). Cada caso
# tem HOME próprio; o estado anterior (histórico, exceções) vem da fixture por parity/setup-estado.sh, gerado pelo
# corpo do TS com instante fixo. `--dir /usr` faz o papel da pasta temporária do golden.

[[case]]
id = "leitura.modos"
argv = ["modos"]
ts_cmd = ["{skill}/src/cli.ts", "cerberus"]
env = { HADES_CERBERUS_TIMEOUT_S = "3" }
compare = ["stdout", "stderr", "exit"]

