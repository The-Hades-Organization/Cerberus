# Matriz de paridade da Porta: `hades cerberus-check porta/<guarda>` (TS, Hades-Skill) contra `cerberus check
# porta/<guarda>`. O lado TS passa por parity/ts-check.ts, que troca `check` por `cerberus-check` e põe CERBERUS_SKILL.
# Origem: os 66 casos do golden legado (loop/test/golden/legado/cerberus-porta-legado.json,
# loop/test/ts/cerberus-porta-legado.test.ts). O repositório de cada caso é montado no HOME por parity/setup/porta-*.sh
# (o `cwd` escolhe qual), e as respostas de `gh`/`devtunnel` vêm de $HOME/fix, lidas pelos stubs de parity/stubs.
# O caso plano-aprovado.registro-ilegivel fica em cases-parser.toml (erro do parser normalizado nos dois lados).
# Caminhos do contexto são relativos ao repositório do caso; o intervalo do segredo-diff é HEAD~1..HEAD.

[[case]]
id = "porta.remote-push.destacado"
argv = ["check", "porta/remote-push"]
ts_cmd = ["{cases_dir}/ts-check.ts", "{skill}"]
setup = "setup/porta-remote.sh"
cwd = "destacado"
env = { HADES_CERBERUS_PORTA_TUNEL_HOSTS = "*.devtunnels.ms", GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", CERBERUS_MOMENTO = "push", CERBERUS_CTX = "{}" }
compare = ["stdout", "stderr", "exit"]

