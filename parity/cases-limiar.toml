# Matriz de paridade do Limiar: `hades cerberus-check limiar <guarda>` (TS, Hades-Skill) contra `cerberus check limiar
# <guarda>`. O lado TS passa por parity/ts-check.ts, como na Porta.
# Origem: os 106 casos do golden legado (loop/test/golden/legado/cerberus-limiar-legado.json,
# loop/test/ts/cerberus-limiar-legado.test.ts), na ordem do golden, e 3 do Ensaio (loop/test/ts/cerberus-ensaio.test.ts),
# que precisam de bubblewrap. Os 2 casos de update b-perfil com o erro do parser no veredito (executavel e invariante)
# ficam em cases-parser.toml.
# Os estados de plugin (prévia do add, pacote instalado, update com as branches) saem do `hades plugins` da skill
# fixada, por parity/limiar-estado.ts, em parity/gerado/limiar/; os setups setup/limiar-*.sh desempacotam o estado no
# HOME do lado e aplicam a mutação do caso. Os commits têm autor e data fixos: os shas do contexto são estáveis.
# Caminhos do contexto (`pack_dir`, `HADES_DATA` do "sem registro") são relativos ao HOME, que é o cwd do caso.

[[case]]
id = "limiar.add-com-a-previa.commit-fixado"
# add com a prévia [commit-fixado]
argv = ["check", "limiar", "commit-fixado"]
ts_cmd = ["{cases_dir}/ts-check.ts", "{skill}"]
setup = "setup/limiar-add.sh"
env = { GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", CERBERUS_MOMENTO = "plugin", CERBERUS_CTX = "{\"plugin\":\"lim\",\"commit\":\"51d60a804637a75b3c28e932df28a85549fbea03\",\"op\":\"add\"}" }
compare = ["stdout", "stderr", "exit"]

