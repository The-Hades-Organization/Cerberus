# Matriz de paridade da Vigília: `hades cerberus-check vigilia/<auditoria|coerencia> <guarda>` (TS, Hades-Skill) contra
# `cerberus check vigilia/...`. O lado TS passa por parity/ts-check.ts. Origem: as 105 chamadas do golden legado
# (loop/test/golden/legado/cerberus-vigilia-legado.json, loop/test/ts/cerberus-vigilia-legado.test.ts), na ordem dele; o
# número no id e no cwd é o da chamada. parity/setup/vigilia.sh monta o estado de cada caso pelo cwd (`vNNN`).
# Os casos 009, 014 e 092 ficam em cases-parser.toml (erro do parser de JSON normalizado nos dois lados, D5).

[[case]]
id = "vigilia.000.uso.sem-guarda"
argv = ["check", "vigilia/auditoria"]
ts_cmd = ["{cases_dir}/ts-check.ts", "{skill}"]
setup = "setup/vigilia.sh"
cwd = "v000"
env = { GIT_CONFIG_GLOBAL = "/dev/null", GIT_CONFIG_SYSTEM = "/dev/null", CERBERUS_MOMENTO = "push", CERBERUS_CTX = "{}" }
compare = ["stdout", "stderr", "exit"]

